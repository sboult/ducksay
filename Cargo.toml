[package]
name = "ducksay"
version = "0.2.0"
edition = "2024"
description = "Make Waddles say things from your terminal"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sboult/ducksay"
keywords = ["cli", "ascii", "aws"]
categories = ["command-line-utilities"]

[[bin]]
name = "ducksay"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
